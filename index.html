<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>脑屎 · Memory Brain</title>
<meta name="theme-color" content="#0c0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="脑屎">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:48250; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0c0e1a; --panel:rgba(20,23,42,.88); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#eceeff; --muted:#8a90b8; --accent:#7c6cff; --cyan:#22d3ee; --green:#34d399; --amber:#fbbf24; --red:#f87171; --pink:#f472b6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
input,textarea{user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:18px;height:18px;flex:none}

/* ---------- 画布 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background:radial-gradient(1100px 760px at 15% 5%,rgba(124,108,255,.14),transparent 60%),
             radial-gradient(900px 700px at 95% 95%,rgba(34,211,238,.09),transparent 60%),var(--bg)}
#stage.panning{cursor:grabbing}
#stage.connecting,#stage.connecting .nb{cursor:crosshair}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle,rgba(255,255,255,.13) 1.1px,transparent 1.3px)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.eg{fill:none;stroke-width:9;opacity:.06}
.ef{fill:none;stroke-width:2;opacity:.42;stroke-dasharray:5 9;stroke-linecap:round;animation:flow 1.4s linear infinite}
.ef.hot{opacity:1;stroke-width:2.6}
.tmp{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 6;opacity:.7}
@keyframes flow{to{stroke-dashoffset:-14}}

/* ---------- 节点 ---------- */
.node{position:absolute;--s:62px;width:150px;margin-left:-75px;margin-top:calc(var(--s) / -2);display:flex;justify-content:center;pointer-events:none;transition:opacity .3s,filter .3s}
.node .nb{pointer-events:auto;display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.iw{position:relative;width:var(--s);height:var(--s)}
.ico{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,#262b52,#171a33);
  border:2px solid color-mix(in srgb,var(--c) 75%,transparent);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 13%,transparent),0 12px 30px -8px color-mix(in srgb,var(--c) 70%,transparent);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.ico img{width:70%;height:70%;object-fit:contain;pointer-events:none}
.ico .emo{font-size:calc(var(--s) * .46);line-height:1}
.ico .txt{font-weight:800;font-size:calc(var(--s) * .3);color:#fff;letter-spacing:-.5px}
.t-account .ico{background:linear-gradient(150deg,#ffffff,#dde2ff)}
.t-account .ico .txt{color:#2b2f55}
.t-computer .ico{border-radius:20px;background:linear-gradient(150deg,#1f3b3a,#13221f)}
.t-note{--s:58px}
.t-note .ico{border-radius:14px;transform:rotate(-5deg);background:linear-gradient(150deg,#fde68a,#f59e0b);border-color:#fff6}
.t-hub{--s:92px}
.t-hub .ico{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#1a1d3a),#14162b 70%);animation:breathe 4.5s ease-in-out infinite}
.t-hub .iw::before{content:"";position:absolute;inset:-9px;border-radius:50%;
  background:conic-gradient(var(--c),transparent 30%,var(--c) 55%,transparent 80%,var(--c));
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 70%,transparent 71%);
  animation:spin 9s linear infinite;opacity:.8}
.nb:hover .ico{transform:translateY(-4px) scale(1.07)}
.t-note .nb:hover .ico{transform:translateY(-4px) rotate(3deg) scale(1.07)}
.ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--c);opacity:0;pointer-events:none}
.t-computer .ring{border-radius:26px}.t-note .ring{border-radius:20px}
.sel .ring{opacity:1;animation:ringp 1.8s ease-out infinite}
.ping .ring{opacity:1;animation:ping .9s ease-out 3}
.label{margin-top:9px;font-size:13px;font-weight:650;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:2px 9px;border-radius:9px;background:rgba(12,14,26,.55);backdrop-filter:blur(6px)}
.t-hub .label{font-size:15px;margin-top:13px}
.sub{font-size:11px;color:var(--muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.port{position:absolute;right:-7px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--c);border:3px solid var(--bg);
  opacity:0;transform:scale(.3);transition:.2s;cursor:crosshair;z-index:2}
.port::after{content:"";position:absolute;inset:-10px}
.nb:hover .port,.sel .port{opacity:1;transform:scale(1)}
.node.dim{opacity:.13;filter:grayscale(1)}
.node.target .ico{transform:scale(1.15);box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 35%,transparent)}
.node.bye .nb{animation:out .3s forwards}
@keyframes pop{0%{transform:scale(0) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes out{to{transform:scale(0) rotate(15deg);opacity:0}}
@keyframes breathe{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 10%,transparent),0 14px 46px -6px color-mix(in srgb,var(--c) 85%,transparent)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringp{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes ping{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.8);opacity:0}}

/* ---------- 浮动 UI ---------- */
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:0 18px 50px -18px rgba(0,0,0,.7)}
.bar{position:fixed;top:14px;display:flex;align-items:center;gap:6px;padding:6px;border-radius:16px;z-index:20}
#barL{left:14px}#barR{right:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 2px 4px}
.blogo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:url(icons/icon-192.png) center/cover,linear-gradient(135deg,var(--accent),var(--cyan));box-shadow:0 6px 18px -4px var(--accent);animation:think 3.5s ease-in-out infinite}
@keyframes think{50%{transform:rotate(-8deg) scale(1.06)}}
.brand b{display:block;font-size:14px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px}
.tb{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:11px;border:0;background:transparent;font-size:13px;color:var(--text);transition:.15s}
.tb:hover{background:rgba(255,255,255,.08)}.tb:active{transform:scale(.94)}
.tb.primary{background:linear-gradient(135deg,var(--accent),#9b8cff);box-shadow:0 6px 18px -6px var(--accent)}
kbd{font:11px ui-monospace,Consolas,monospace;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted)}
.status{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:0;border-radius:11px;background:rgba(255,255,255,.04);font-size:12px;color:var(--muted);max-width:280px}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;box-shadow:0 0 0 3px rgba(251,191,36,.18)}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.dot.saving{animation:blink .6s infinite}
@keyframes blink{50%{opacity:.3}}
#zoom{position:fixed;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;padding:5px;border-radius:14px;z-index:20}
#zoom .tb{width:34px;justify-content:center;padding:0}
#zl{font-size:12px;color:var(--muted);width:46px;text-align:center;cursor:pointer}

/* 下拉菜单 */
.menu{position:fixed;top:64px;right:14px;width:300px;border-radius:16px;padding:8px;z-index:30;opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:.2s}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:11px}
.mi:hover{background:rgba(255,255,255,.07)}
.mi .em{font-size:20px;line-height:1.2}
.mi b{display:block;font-size:13px;font-weight:600}.mi small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
.msep{height:1px;background:var(--line);margin:6px 4px}

/* 径向添加菜单 */
#radial{position:fixed;width:0;height:0;z-index:25;pointer-events:none}
#radial .core{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);transform:scale(0);transition:.25s}
#radial.open .core{transform:scale(1);animation:spin 6s linear infinite}
.rb{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:22px;transform:translate(0,0) scale(0);opacity:0;transition:transform .38s cubic-bezier(.34,1.56,.64,1),opacity .2s,background .15s;pointer-events:none}
.rb small{font-size:10px;color:var(--muted)}
.rb:hover{background:color-mix(in srgb,var(--rc) 30%,rgba(20,23,42,.9));border-color:var(--rc)}
#radial.open .rb{opacity:1;pointer-events:auto;transform:translate(var(--tx),var(--ty)) scale(1)}

/* ---------- 详情面板 ---------- */
#panel{position:fixed;top:14px;right:14px;bottom:14px;width:390px;border-radius:22px;z-index:22;display:flex;flex-direction:column;
  transform:translateX(430px);transition:transform .42s cubic-bezier(.2,.9,.25,1.12)}
#panel.open{transform:none}
#panel .scroll{flex:1;overflow:auto;padding:18px 18px 10px}
#panel .scroll::-webkit-scrollbar{width:6px}#panel .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.ph{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.pico{position:relative;width:72px;height:72px;flex:none;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;overflow:hidden;padding:0;
  background:linear-gradient(150deg,#262b52,#171a33);box-shadow:0 10px 30px -10px var(--c);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.pico.k-account{background:linear-gradient(150deg,#fff,#dde2ff)}.pico.k-account .txt{color:#2b2f55}
.pico.k-computer{border-radius:22px}.pico.k-note{border-radius:16px;background:linear-gradient(150deg,#fde68a,#f59e0b)}
.pico:hover{transform:scale(1.06) rotate(-4deg)}
.pico img{width:70%;height:70%;object-fit:contain}.pico .emo{font-size:34px}.pico .txt{font-weight:800;font-size:22px}
.pico::after{content:"换图标";position:absolute;inset:auto 0 0;font-size:10px;padding:3px 0;background:rgba(0,0,0,.55);color:#fff;transform:translateY(100%);transition:.2s}
.pico:hover::after{transform:none}
.ptitle{flex:1;min-width:0}
.ti{width:100%;background:none;border:0;outline:0;font-size:21px;font-weight:700;color:var(--text);padding:2px 0;font-family:inherit}
.ti::placeholder{color:#5c6290}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 80%,#fff);margin-top:4px}
.x{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.05);display:grid;place-items:center;align-self:flex-start;flex:none}
.x:hover{background:rgba(255,255,255,.1)}
.row{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;padding:7px 8px 7px 12px;margin-bottom:8px;transition:border-color .2s,transform .3s,opacity .3s;animation:rowIn .35s both}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.row:focus-within{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.row.secret{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 7%,transparent),rgba(255,255,255,.02))}
.fl{display:block;width:100%;font-size:11px;color:var(--muted);background:none;border:0;outline:0;padding:0;font-family:inherit}
.fv{display:flex;align-items:center;gap:2px}
.fi{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:14.5px;padding:4px 0;font-family:inherit}
.secret .fi{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;letter-spacing:.5px}
.fi::placeholder{color:#4f557f}
.ib{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;transition:.15s}
.ib:hover{background:rgba(255,255,255,.09);color:var(--text)}.ib:active{transform:scale(.85)}
.ib svg{width:16px;height:16px}
.ib.rm{opacity:0}.row:hover .ib.rm{opacity:.7}
@media (hover:none){.ib.rm{opacity:.5}}
.meter{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin:4px 4px 2px 0;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:2px;transition:width .4s,background .4s}
.addf{display:flex;gap:8px;margin:4px 0 16px}
.sbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:11px;border:1px dashed var(--line2);background:transparent;font-size:12.5px;color:var(--muted);transition:.15s}
.sbtn:hover{border-style:solid;color:var(--text);background:rgba(255,255,255,.04)}
.sec{font-size:11px;color:var(--muted);margin:14px 0 7px;display:flex;align-items:center;gap:6px;letter-spacing:.5px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.note{width:100%;min-height:90px;resize:vertical;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;padding:10px 12px;color:var(--text);font:14px/1.6 inherit;font-family:inherit;outline:0}
.note:focus{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.t-note-panel .note{min-height:200px;background:rgba(251,191,36,.05)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 4px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;max-width:100%}
.lk:hover{border-color:var(--line2)}
.lk .mi2{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#fff;font-size:13px;flex:none}
.lk .mi2 img{width:72%;height:72%;object-fit:contain}.lk .mi2 .txt{font-size:9px;font-weight:800;color:#2b2f55}
.lk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.lk .ul{width:22px;height:22px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center}
.lk .ul:hover{background:rgba(248,113,113,.2);color:var(--red)}
.lk .ul svg{width:12px;height:12px}
.lbtns{display:flex;gap:8px;margin-top:8px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.cd{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--cc);transition:.2s;padding:0}
.cd:hover{transform:scale(1.15)}.cd.on{border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 40%,transparent)}
.pf{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.danger{display:flex;align-items:center;gap:5px;border:0;background:rgba(248,113,113,.1);color:var(--red);height:32px;padding:0 12px;border-radius:10px;font-size:12px}
.danger:hover{background:rgba(248,113,113,.2)}

/* ---------- 搜索 ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;background:rgba(6,7,15,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s}
.overlay.open{opacity:1;pointer-events:auto}
.sbox{width:min(620px,92vw);border-radius:20px;overflow:hidden;transform:translateY(-14px) scale(.97);transition:.28s cubic-bezier(.34,1.4,.64,1)}
.overlay.open .sbox{transform:none}
.sin{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sin svg{width:22px;height:22px;color:var(--accent)}
.sin input{flex:1;background:none;border:0;outline:0;font-size:18px;color:var(--text);font-family:inherit}
.sres{max-height:52vh;overflow:auto;padding:6px}
.sr{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;cursor:pointer;animation:rowIn .25s both}
.sr.on{background:color-mix(in srgb,var(--c) 18%,transparent)}
.sr .mi2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#232849;font-size:19px;flex:none;border:1.5px solid var(--c)}
.sr .mi2.account{background:#fff}.sr .mi2 img{width:70%;height:70%;object-fit:contain}.sr .mi2 .txt{font-size:12px;font-weight:800}.sr .mi2.account .txt{color:#2b2f55}
.sr b{display:block;font-size:14px}.sr small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}
.sr mark{background:none;color:var(--cyan);font-weight:700}
.shint{padding:9px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,7,15,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.2s;padding:16px}
.modal.open{opacity:1;pointer-events:auto}
.card{width:min(520px,100%);max-height:88vh;overflow:auto;border-radius:22px;padding:20px;transform:scale(.94);transition:.3s cubic-bezier(.34,1.4,.64,1)}
.modal.open .card{transform:none}
.card.wide{width:min(860px,100%)}
.card h3{margin:0 0 4px;font-size:17px}.card p.d{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-bottom:6px}
.pg{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:24px;position:relative;padding:0;transition:.15s}
.pg:hover{transform:scale(1.08);border-color:var(--line2)}
.pg.logo{background:#fff}.pg img{width:70%;height:70%;object-fit:contain}
.pg .del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:11px;display:none;line-height:20px;padding:0}
.pg:hover .del{display:block}
.pg.up{border-style:dashed;font-size:12px;color:var(--muted);flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;background:transparent}
.pg.up b{font-size:20px;font-weight:400}
.trow{display:flex;gap:8px}
.tin{flex:1;height:40px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);padding:0 12px;font-size:14px;outline:0;font-family:inherit}
.btn{height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-size:13px}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{background:linear-gradient(135deg,var(--accent),#9b8cff);border:0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.cf .ct{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.side{border:2px solid var(--line);border-radius:13px;padding:10px 12px;cursor:pointer;font-size:12px;line-height:1.7;transition:.15s;position:relative}
.side:hover{border-color:var(--line2)}
.side.on{border-color:var(--green);background:rgba(52,211,153,.07)}
.side.on::after{content:"✓ 保留这个";position:absolute;top:8px;right:10px;font-size:11px;color:var(--green)}
.side h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.side .df{color:var(--amber)}
.bothbtn{font-size:11px;border:1px solid var(--line2);background:none;border-radius:8px;padding:4px 10px;color:var(--muted)}
.bothbtn.on{border-color:var(--cyan);color:var(--cyan)}

/* ---------- 提示 / 粒子 ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;font-size:13px;pointer-events:auto;animation:tin .4s cubic-bezier(.34,1.56,.64,1) both}
.toast button{border:0;background:rgba(255,255,255,.1);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--cyan)}
.toast.go{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(20px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(10px);opacity:0}}
.pt{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:70;animation:burst .8s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.2);opacity:0}}
#banner{position:fixed;top:70px;left:50%;transform:translate(-50%,-20px);z-index:21;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.3s}
#banner.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tips{position:fixed;left:14px;bottom:14px;width:260px;border-radius:16px;padding:14px 16px;font-size:12px;line-height:1.9;color:var(--muted);z-index:20;animation:tin .6s .6s both}
#tips b{color:var(--text);font-weight:600}
#tips .x{position:absolute;top:8px;right:8px;width:24px;height:24px}

html,body{overscroll-behavior:none}
/* 图标小圆（关联列表 / 搜索结果） */
.lk .mi2{background:#262b52}.lk .mi2.k-account,.sr .mi2.k-account{background:#fff}.lk .mi2.k-note,.sr .mi2.k-note{background:#fbbf24}
.lk .mi2 .txt{color:#fff}.lk .mi2.k-account .txt,.sr .mi2.k-account .txt{color:#2b2f55}
.sym{display:block}
.ico .sym{width:54%;height:54%;color:var(--c)}
.t-hub .ico .sym{color:#fff}.t-note .ico .sym{color:#5b3a00}
.pico .sym{width:50%;height:50%;color:var(--c)}.pico.k-hub .sym{color:#fff}.pico.k-note .sym{color:#5b3a00}
.mi2 .sym{width:62%;height:62%;color:var(--c)}.mi2.k-note .sym{color:#5b3a00}
.pg .sym{width:46%;height:46%;color:#d6d9ff}
.pg.symb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;aspect-ratio:auto;height:62px}
.pg.symb small{font-size:9.5px;color:var(--muted);white-space:nowrap}
.pg.symb:hover .sym{color:#fff}
/* 底部工具条 */
#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:16px;z-index:20}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.04);border-radius:12px;padding:2px}
.seg button{width:40px;height:34px;border:0;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center;transition:.18s}
.seg button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.seg button.on{background:linear-gradient(135deg,var(--accent),#9b8cff);color:#fff;box-shadow:0 4px 14px -4px var(--accent)}
.seg button[data-tool=cut].on{background:linear-gradient(135deg,#f87171,#fb923c);box-shadow:0 4px 14px -4px #f87171}
.dsep{width:1px;height:22px;background:var(--line2);margin:0 5px}
#dock .tb{width:38px;padding:0;justify-content:center}
.tb:disabled{opacity:.28;pointer-events:none}
#stage.tool-hand{cursor:grab}
#stage.tool-cut,#stage.tool-cut .nb,#stage.tool-cut .port{cursor:crosshair}
/* 框选 / 剪刀 */
#marq{position:fixed;display:none;border:1.5px dashed #a99cff;background:rgba(124,108,255,.12);border-radius:8px;pointer-events:none;z-index:15}
#knife{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:16;overflow:visible}
#knife path{fill:none;stroke:#f87171;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 6;filter:drop-shadow(0 0 6px #f87171)}
/* 连线：可点可剪 */
.eh{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.eh:hover+.ef{opacity:1;stroke-width:3.2}
.ef.picked{opacity:1;stroke-width:3.6;stroke-dasharray:none;filter:drop-shadow(0 0 6px currentColor)}
.snip{fill:none;stroke-width:3;animation:snip .6s ease-out forwards}
@keyframes snip{0%{opacity:1;stroke-dasharray:1000 0}40%{opacity:1;stroke-dasharray:30 14}100%{opacity:0;stroke-width:9;stroke-dasharray:2 40}}
#cutBtn{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#f87171,#fb923c);color:#fff;display:none;place-items:center;box-shadow:0 8px 24px -6px #f87171;z-index:3;padding:0}
#cutBtn.show{display:grid;animation:cutIn .35s cubic-bezier(.34,1.56,.64,1)}
#cutBtn:hover{filter:brightness(1.1)}
#cutBtn svg{width:19px;height:19px}
@keyframes cutIn{from{opacity:0;rotate:-90deg}}
/* 多选工具条 */
#selbar{position:fixed;top:72px;left:50%;width:max-content;transform:translate(-50%,-10px);display:flex;align-items:center;gap:3px;padding:6px 6px 6px 14px;border-radius:15px;z-index:21;opacity:0;pointer-events:none;transition:.25s;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
#selbar.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#selbar .cnt{font-size:13px;font-weight:650;margin-right:6px;white-space:nowrap}
#selbar .tb{height:32px;font-size:12px;padding:0 10px}
#selbar .tb svg{width:16px;height:16px}
.sbc{display:flex;gap:4px;padding:0 6px}
#selbar .cd{width:18px;height:18px}
/* 右键 / 长按菜单 */
#ctx{position:fixed;min-width:200px;border-radius:14px;padding:6px;z-index:35;opacity:0;transform:scale(.96);transform-origin:top left;pointer-events:none;transition:opacity .15s,transform .15s}
#ctx.open{opacity:1;transform:none;pointer-events:auto}
.ci{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:13px;text-align:left}
.ci:hover{background:rgba(255,255,255,.08)}
.ci svg{width:16px;height:16px;color:var(--muted)}.ci .ce{width:16px;text-align:center;font-size:14px}
.ci span{flex:1}.ci kbd{font-size:10px}
.ci.dg,.ci.dg svg{color:var(--red)}
/* 拖图片进来 */
#stage.dropping::after{content:"松手：用这张图片新建一个账号（拖到某个节点上 = 换它的图标）";position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 24px;border-radius:18px;background:rgba(124,108,255,.22);border:2px dashed #a99cff;color:#fff;font-size:15px;pointer-events:none;backdrop-filter:blur(4px)}
.node.droptarget .ico{transform:scale(1.18);box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.pfb{display:flex;gap:6px;align-items:center}
#toasts{bottom:78px}
/* 锁屏 */
#lock{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:20px;
  background:radial-gradient(900px 600px at 30% 10%,rgba(124,108,255,.28),transparent 60%),radial-gradient(800px 600px at 80% 90%,rgba(34,211,238,.18),transparent 60%),rgba(8,9,18,.9);
  backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2)}
#lock.open{display:grid}
body.is-locked #barL,body.is-locked #barR,body.is-locked #dock,body.is-locked #zoom,body.is-locked #tips{visibility:hidden}
.lk-card{width:min(380px,100%);text-align:center;padding:30px 26px 18px;border-radius:28px;background:rgba(20,23,42,.75);border:1px solid var(--line2);
  box-shadow:0 30px 80px -30px rgba(124,108,255,.6);animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.lk-card.bye{animation:lkbye .38s ease-in forwards}
@keyframes lkbye{to{transform:scale(1.08);opacity:0;filter:blur(6px)}}
.lk-card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lk-logo{width:92px;height:92px;margin:0 auto 14px;border-radius:28px;background:url(icons/icon-192.png) center/cover;box-shadow:0 18px 50px -12px #7c6cff;animation:think 3.5s ease-in-out infinite}
.lk-card h2{margin:0 0 6px;font-size:24px}
.lk-sub{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.6}
.lk-in{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:14px;padding:0 6px 0 14px;margin-bottom:10px;transition:border-color .2s}
.lk-in:focus-within{border-color:var(--accent)}
.lk-in input{flex:1;min-width:0;height:48px;background:none;border:0;outline:0;color:var(--text);font-size:16px;font-family:inherit;letter-spacing:.5px}
.lk-meter{margin:-4px 4px 12px}
.lk-go{width:100%;height:48px;font-size:15px;border-radius:14px;margin-top:4px}
.lk-go:disabled{opacity:.6}
.lk-err{min-height:18px;margin:10px 0 0;color:var(--red);font-size:13px}
.lk-hint{font-size:12.5px;color:var(--amber);margin:-2px 0 12px}
.lk-warn{font-size:12px;color:var(--muted);text-align:left;line-height:1.6;margin:4px 2px 12px;padding:10px 12px;border-radius:12px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2)}
.lk-link{background:none;border:0;color:var(--muted);font-size:12.5px;margin-top:2px;text-decoration:underline;text-underline-offset:3px}
.lk-foot{display:flex;gap:6px;align-items:center;justify-content:center;font-size:11px;color:#5d6390;margin:16px 0 0}
.lk-foot svg{width:13px;height:13px}
body.linked #toasts{bottom:178px}
/* 连接条 */
#linkbar{position:fixed;left:50%;bottom:74px;transform:translate(-50%,20px);width:max-content;max-width:calc(100% - 20px);display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:16px;z-index:24;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.34,1.4,.64,1)}
#linkbar.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.lbh{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}.lbs{color:var(--muted);font-size:12px}
.lbb{display:flex;gap:6px;flex-wrap:wrap}.lbb .tb{height:34px;font-size:12.5px;background:rgba(255,255,255,.05)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:lpulse 1.6s infinite}
.ldot.wait{background:var(--amber);vertical-align:middle;margin-right:4px}
@keyframes lpulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.wopt.wide{grid-column:1/-1;margin-top:10px;width:100%;background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(34,211,238,.12));border-color:rgba(124,108,255,.5)}
/* 生成密码确认 / 历史密码 */
.gconf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 2px;padding:9px 10px;border-radius:11px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);font-size:12.5px;animation:rowIn .25s both}
.gconf small{color:var(--muted);flex-basis:100%}
.gconf span{margin-left:auto;display:flex;gap:6px}.gconf .btn{height:30px;padding:0 14px;font-size:12px}
.hl{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);animation:rowIn .25s both}
.hlt{font-size:11px;color:var(--muted);margin-bottom:2px}
.hi{display:flex;align-items:center;gap:4px;font-size:12px}
.hv{flex:1;font-family:ui-monospace,Consolas,monospace;cursor:pointer;padding:4px 0;word-break:break-all}
.hi small{color:var(--muted);white-space:nowrap}
/* 分组框 */
#frames{position:absolute;left:0;top:0}
.frame{position:absolute;border:2px solid color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 6%,transparent);
  border-radius:24px;pointer-events:none;transition:box-shadow .25s,background .25s}
.frame.fsel{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),0 20px 60px -20px var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.frame.fnew{animation:fnew .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes fnew{from{transform:scale(.9);opacity:0}}
.ftab{position:absolute;left:18px;top:-19px;height:36px;padding:0 14px;border-radius:13px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#1a1d3a));color:#fff;font-size:15px;font-weight:700;
  pointer-events:auto;cursor:move;white-space:nowrap;box-shadow:0 8px 22px -8px var(--c);user-select:none;transition:transform .2s}
.ftab:hover{transform:translateY(-2px)}
.ftab .fc{font-size:11px;font-weight:600;background:rgba(0,0,0,.25);border-radius:8px;padding:1px 7px}
.ftab .fc:empty{display:none}
.fin{background:rgba(0,0,0,.25);border:0;outline:0;color:#fff;font:inherit;font-weight:700;width:150px;border-radius:7px;padding:3px 6px}
.fres{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:7px;background:var(--c);border:3px solid var(--bg);pointer-events:auto;cursor:nwse-resize;opacity:0;transition:opacity .2s}
.frame.fsel .fres{opacity:1}
#selbar .cd.on{border-color:#fff}
/* 扫码 */
.qrwrap{position:relative;display:grid;place-items:center;background:#fff;border-radius:20px;padding:12px;margin:8px auto 6px;width:fit-content;box-shadow:0 18px 50px -20px #7c6cff}
#qrc{display:block;width:min(72vw,440px);height:auto;image-rendering:pixelated}
.qidx{position:absolute;right:12px;bottom:-26px;font-size:11px;color:var(--muted)}
.qrinfo{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.qopt{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;margin-top:10px;color:var(--muted)}
.camwrap{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:1;width:min(78vw,420px);margin:8px auto}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap::after{content:"";position:absolute;inset:9%;border:3px solid rgba(255,255,255,.55);border-radius:18px}
.scanline{position:absolute;left:10%;right:10%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);box-shadow:0 0 14px #22d3ee;animation:scan 1.6s ease-in-out infinite alternate;z-index:1}
@keyframes scan{from{top:12%}to{top:86%}}
.qprog{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.qprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .25s}
#tips{bottom:14px}
#stage{-webkit-touch-callout:none}
.grab{display:none}
/* 欢迎页 */
.wel{text-align:center;padding:6px 4px 2px}
.wlogo{width:84px;height:84px;margin:0 auto 14px;border-radius:24px;background:url(icons/icon-192.png) center/cover,linear-gradient(135deg,var(--accent),var(--cyan));box-shadow:0 14px 40px -10px var(--accent);animation:think 3.5s ease-in-out infinite}
.wel h3{font-size:20px;margin-bottom:8px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.wopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:30px;transition:.2s}
.wopt:hover,.wopt:active{transform:translateY(-3px);border-color:var(--accent);background:rgba(124,108,255,.12)}
.wopt b{font-size:14px;margin-top:4px}.wopt small{font-size:11px;color:var(--muted)}
.lock-note{display:flex;gap:8px;align-items:center;justify-content:center;font-size:11px;color:var(--muted);margin-top:14px}
@media (max-width:760px){
  .brand small,.tb .lbl,.tb kbd,.status span{display:none}
  .status{max-width:none;padding:0 12px}
  #barL{left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top))}
  #barR{right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top))}
  .brand{padding-right:4px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:min(68vh,calc(100vh - 150px - env(safe-area-inset-top)));border-radius:24px 24px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom)}
  #panel.open{transform:none}
  #panel.dragging{transition:none}
  #panel .scroll{padding-top:6px}
  .grab{display:block;height:26px;margin:0 0 -4px;touch-action:none;cursor:grab}
  .grab::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:10px auto 0}
  #tips{left:12px;right:12px;width:auto;bottom:calc(74px + env(safe-area-inset-bottom))}
  #dock{bottom:calc(10px + env(safe-area-inset-bottom))}
  #linkbar{bottom:calc(70px + env(safe-area-inset-bottom))}
  #selbar{top:calc(62px + env(safe-area-inset-top))}
  .ci{padding:12px;font-size:15px}
  #zoom{display:none}
  .menu{right:8px;left:8px;width:auto;top:calc(58px + env(safe-area-inset-top))}
  #banner{top:calc(60px + env(safe-area-inset-top));width:calc(100% - 20px);justify-content:space-between}
  #toasts{bottom:calc(74px + env(safe-area-inset-bottom));width:calc(100% - 24px)}
  .cf{grid-template-columns:1fr}
  .fi,.ti,.note,.tin,#sq{font-size:16px}
  .ti{font-size:20px}
  .ib{width:38px;height:38px}
  .ib svg{width:18px;height:18px}
  .sbtn{height:42px}
  .lbtns{flex-wrap:wrap}
  .pf{padding:12px 18px}
  .overlay{padding-top:calc(10px + env(safe-area-inset-top))}
  .sres{max-height:60vh}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
  .card{max-height:calc(100vh - 40px - env(safe-area-inset-top))}
}
@media (pointer:coarse){.port{width:22px;height:22px;margin-top:-11px;right:-10px}}
</style>
</head>
<body>

<div id="stage">
  <div id="grid"></div>
  <div id="world"><div id="frames"></div><svg id="edges"><g id="eg"></g><g id="fx"></g></svg><button id="cutBtn" title="剪断这根线 (Delete)"><svg class="i" data-i="scissors"></svg></button></div>
</div>

<!-- 顶栏 -->
<div id="barL" class="bar glass">
  <div class="brand"><div class="blogo"></div><div><b>脑屎</b><small>MEMORY BRAIN</small></div></div>
  <button class="tb primary" id="bAdd" title="新建 (N)"><svg class="i" data-i="plus"></svg><span class="lbl">新建</span></button>
  <button class="tb" id="bSearch" title="搜索"><svg class="i" data-i="search"></svg><span class="lbl">搜索</span><kbd>Ctrl K</kbd></button>
</div>
<div id="barR" class="bar glass">
  <button class="tb" id="bLock" title="立即锁定"><svg class="i" data-i="lock"></svg></button>
  <button class="status" id="status"><i class="dot" id="sdot"></i><span id="stext">仅保存在本浏览器</span></button>
  <button class="tb" id="bData"><svg class="i" data-i="db"></svg><span class="lbl">数据</span></button>
</div>

<div id="dataMenu" class="menu glass">
  <button class="mi" data-m="open" data-only="desktop"><span class="em">📂</span><div><b>打开数据文件</b><small>选 U 盘里的 MyMemory-data.json，之后改动会自动写回这个文件</small></div></button>
  <button class="mi" data-m="saveas" data-only="desktop"><span class="em">💾</span><div><b>新建数据文件 / 另存为</b><small>第一次用：把数据存成文件，放在和软件同一个文件夹</small></div></button>
  <div class="msep" data-only="desktop"></div>
  <button class="mi" data-m="link" data-only="desktop"><span class="em">📶</span><div><b>连接手机 · 双向同步</b><small>手机扫一下就连上（同一个 Wi-Fi），可以选同步方向</small></div></button>
  <button class="mi" data-m="qr"><span class="em">📲</span><div><b>扫码同步</b><small>两台设备面对面扫一扫，不用网、不用线</small></div></button>
  <button class="mi" data-m="export"><span class="em">📤</span><div><b>导出同步包 / 备份</b><small>生成一份副本：传给另一台设备，或者自己留着当备份</small></div></button>
  <button class="mi" data-m="import"><span class="em">🔀</span><div><b>导入并合并</b><small>把对方的同步包合进来，两边都改过的同一条会让你挑</small></div></button>
  <button class="mi" data-m="restore" data-only="mobile"><span class="em">♻️</span><div><b>从备份恢复</b><small>用备份文件「整个替换」本机数据（换手机、重装后用）</small></div></button>
  <div class="msep"></div>
  <div class="msep"></div>
  <button class="mi" data-m="lock"><span class="em">🔒</span><div><b>立即锁定</b><small>离开一下？锁上再走</small></div></button>
  <button class="mi" data-m="chpw"><span class="em">🔑</span><div><b>修改登录密码</b><small>改完会用新密码重新加密</small></div></button>
  <button class="mi" data-m="autolock"><span class="em">⏱</span><div><b>自动锁定</b><small id="alLabel">5 分钟不操作自动锁上</small></div></button>
  <button class="mi" data-m="clear"><span class="em">🧹</span><div><b>清空示例数据</b><small>开始放你自己的内容</small></div></button>

let camAnim;
function animateCam(tx,ty,tz,dur=650){
  cancelAnimationFrame(camAnim);
  const fx=cam.x,fy=cam.y,fz=cam.z,t0=performance.now();
  const step=t=>{const k=ease(Math.min(1,(t-t0)/dur));
    cam.x=fx+(tx-fx)*k; cam.y=fy+(ty-fy)*k; cam.z=fz+(tz-fz)*k; applyCam();
    if(k<1) camAnim=requestAnimationFrame(step)};
  camAnim=requestAnimationFrame(step);
}

function fitView(instant){
  const ns=alive(); if(!ns.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  ns.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)});
  (S.groups||[]).forEach(g=>{if(g.deleted)return;x0=Math.min(x0,g.x+80);y0=Math.min(y0,g.y+40);x1=Math.max(x1,g.x+g.w-80);y1=Math.max(y1,g.y+g.h-80)});
  const w=x1-x0+260,h=y1-y0+300, z=clamp(Math.min(innerWidth/w,(innerHeight-90)/h),.25,1.25);

}

function layoutMenu(ids,x,y){openCtx(x,y,[
  {emo:"🔲",label:"网格",fn:()=>layout(ids,"grid")},
  {emo:"➡️",label:"排成一行",fn:()=>layout(ids,"row")},
  {emo:"⬇️",label:"排成一列",fn:()=>layout(ids,"col")},
  {emo:"⭕",label:"围成一圈",fn:()=>layout(ids,"circle")},
  {emo:"🗂️",label:"按类型分列",fn:()=>layout(ids,"type")},
  {emo:"🌳",label:"树状展开（按连线）",fn:()=>layout(ids,"tree")},
  {emo:"✨",label:"自动散开（不重叠）",fn:()=>layout(ids,"auto")}])}
function layout(ids,kind){
  const ns=ids.map(byId).filter(n=>n&&!n.deleted); if(ns.length<2){toast("至少选 2 个才能排列");return}
  const N=ns.length, cx=ns.reduce((s,n)=>s+n.x,0)/N, cy=ns.reduce((s,n)=>s+n.y,0)/N, P=new Map();
  const inSel=new Set(ns.map(n=>n.id)), adj=new Map(ns.map(n=>[n.id,[]]));
  S.edges.forEach(e=>{if(!e.deleted&&inSel.has(e.a)&&inSel.has(e.b)){adj.get(e.a).push(e.b);adj.get(e.b).push(e.a)}});
  const deg=id=>adj.get(id).length;
  if(kind==="grid"){const cols=Math.ceil(Math.sqrt(N)),rows=Math.ceil(N/cols);
    [...ns].sort((a,b)=>Math.round(a.y/90)-Math.round(b.y/90)||a.x-b.x).forEach((n,i)=>P.set(n,[cx+(i%cols-(cols-1)/2)*180,cy+(Math.floor(i/cols)-(rows-1)/2)*165]))}
  else if(kind==="row") [...ns].sort((a,b)=>a.x-b.x).forEach((n,i)=>P.set(n,[cx+(i-(N-1)/2)*175,cy]));
  else if(kind==="col") [...ns].sort((a,b)=>a.y-b.y).forEach((n,i)=>P.set(n,[cx,cy+(i-(N-1)/2)*140]));
  else if(kind==="circle"){
    const hub=[...ns].filter(n=>n.type==="hub").sort((a,b)=>deg(b.id)-deg(a.id))[0];
    const ring=hub&&deg(hub.id)>=2?ns.filter(n=>n!==hub):ns, R=Math.max(200,ring.length*180/(2*Math.PI));
    if(ring!==ns) P.set(hub,[cx,cy]);
    ring.sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx))
      .forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/ring.length;P.set(n,[cx+Math.cos(a)*R,cy+Math.sin(a)*R])})}
  else if(kind==="type"){
    const order=["hub","computer","account","note"].filter(t=>ns.some(n=>n.type===t)), mx=Math.max(...order.map(t=>ns.filter(n=>n.type===t).length));
    order.forEach((t,ci)=>ns.filter(n=>n.type===t).sort((a,b)=>(a.title||"").localeCompare(b.title||"","zh"))
      .forEach((n,ri)=>P.set(n,[cx+(ci-(order.length-1)/2)*230,cy+(ri-(mx-1)/2)*145])))}
  else if(kind==="tree"){
    const seen=new Set(), kids=new Map(), roots=[], depth=new Map();
    const pool=[...ns].sort((a,b)=>(b.type==="hub")-(a.type==="hub")||deg(b.id)-deg(a.id));
    for(const r of pool){ if(seen.has(r.id)) continue; roots.push(r); seen.add(r.id); depth.set(r.id,0); const q=[r.id];
      while(q.length){const id=q.shift(),ch=[];
        adj.get(id).map(byId).sort((a,b)=>a.x-b.x).forEach(c=>{if(!seen.has(c.id)){seen.add(c.id);depth.set(c.id,depth.get(id)+1);ch.push(c.id);q.push(c.id)}});
        kids.set(id,ch)}}
    const W=new Map(), w=id=>{if(W.has(id))return W.get(id);const v=Math.max(1,(kids.get(id)||[]).reduce((s,k)=>s+w(k),0));W.set(id,v);return v};
    let cur=0, tot=roots.reduce((s,r)=>s+w(r.id),0);
    const put=(id,l)=>{P.set(byId(id),[cx+(l+w(id)/2-tot/2)*170,0]);let k=l;(kids.get(id)||[]).forEach(c=>{put(c,k);k+=w(c)})};
    roots.forEach(r=>{put(r.id,cur);cur+=w(r.id)});
    const md=Math.max(...depth.values()); ns.forEach(n=>{P.get(n)[1]=cy+(depth.get(n.id)-md/2)*175})}
  else if(kind==="auto"){
    const p=ns.map(n=>({n,x:n.x,y:n.y})), ix=new Map(p.map((q,i)=>[q.n.id,i]));
    for(let it=0;it<320;it++){
      const f=p.map(()=>({x:0,y:0}));
      for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
        let dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,d=Math.hypot(dx,dy)||1; if(d>520) continue;
        const rep=(d<165?2600:0)+42000/(d*d)*40, ux=dx/d,uy=dy/d; f[i].x+=ux*rep/d;f[i].y+=uy*rep/d;f[j].x-=ux*rep/d;f[j].y-=uy*rep/d}
      ns.forEach(n=>adj.get(n.id).forEach(o=>{const i=ix.get(n.id),j=ix.get(o);if(i>j)return;
        const dx=p[j].x-p[i].x,dy=p[j].y-p[i].y,d=Math.hypot(dx,dy)||1,s=(d-210)*.06;f[i].x+=dx/d*s;f[i].y+=dy/d*s;f[j].x-=dx/d*s;f[j].y-=dy/d*s}));
      const cool=1-it/320;
      p.forEach((q,i)=>{f[i].x+=(cx-q.x)*.004;f[i].y+=(cy-q.y)*.004;const m=Math.hypot(f[i].x,f[i].y),lim=40*cool+2;
        if(m>lim){f[i].x*=lim/m;f[i].y*=lim/m} q.x+=f[i].x;q.y+=f[i].y})}
    p.forEach(q=>P.set(q.n,[q.x,q.y]))}
  pushUndo();
  animateTo(ns.filter(n=>P.has(n)).map(n=>({n,fx:n.x,fy:n.y,tx:P.get(n)[0],ty:P.get(n)[1]})),700);
  toast({grid:"🔲 排成网格",row:"➡️ 排成一行",col:"⬇️ 排成一列",circle:"⭕ 围成一圈",type:"🗂️ 按类型分好列",tree:"🌳 按连线展开成树",auto:"✨ 自动散开"}[kind]);
}

/* ================= 分组框（打组） ================= */
let selGroup=null, lastTab={id:null,t:0};
const framesEl=$("#frames"), frameEls=new Map();
const grp=id=>S.groups.find(g=>g.id===id&&!g.deleted);
function groupMembers(g){return g?(g.members||[]).map(byId).filter(n=>n&&!n.deleted):[]}
const insideG=(g,n)=>n.x>=g.x&&n.x<=g.x+g.w&&n.y>=g.y&&n.y<=g.y+g.h;
/* 节点挪动后：落在哪个框里就归哪个组；挪出来就离开 */
function updateMembership(ids){

async function gz(str){
  const u=new TextEncoder().encode(str); let bytes=u, z=0;
  if(window.CompressionStream){bytes=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());z=1}
  let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return {z,b:btoa(s)};
}
async function gunz(z,b){const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
  if(z==="1") return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return new TextDecoder().decode(u)}
function drawQR(cv,text){
  const q=qrcode(0,"L"); q.addData(text,"Byte"); q.make();
  const m=q.getModuleCount(), s=Math.max(3,Math.floor(600/(m+8))), sz=(m+8)*s;
  if(cv.width!==sz){cv.width=cv.height=sz}
  const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,sz,sz); g.fillStyle="#000";
  for(let r=0;r<m;r++)for(let c=0;c<m;c++) if(q.isDark(r,c)) g.fillRect((c+4)*s,(r+4)*s,s,s);
}

/* ================= 连接同步（同一个 Wi-Fi，双向） =================
   电脑：脑屎.exe 在后台开了个“同步站”（只在局域网，端口 48250）
   手机扫电脑上的码 → 拿到地址、一次性令牌、加密钥匙 → 两边通过同步站互传
   同步站只转交加密后的内容，看不到你的数据 */
const LINK_PORT=48250, LOCAL_SRV="http://127.0.0.1:"+LINK_PORT;
let link=null;
const b64e=u=>{let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64url=u=>b64e(u).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64url=s=>b64d(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));
async function lkEnc(obj){
  let u=new TextEncoder().encode(JSON.stringify(obj)), flag=0;
  if(window.CompressionStream){u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());flag=1}
  const plain=new Uint8Array(u.length+1); plain[0]=flag; plain.set(u,1);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},link.key,plain));
  const out=new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12); return b64e(out);
}
async function lkDec(s){
  const all=b64d(s), plain=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:all.subarray(0,12)},link.key,all.subarray(12)));
  const body=plain.subarray(1);
  const txt=plain[0]===1?await new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream("gzip"))).text():new TextDecoder().decode(body);
  return JSON.parse(txt);
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
function httpTransport(base){return{
  put:async(box,b)=>{const r=await withTimeout(fetch(`${base}/put?box=${box}`,{method:"POST",body:b,headers:{"Content-Type":"text/plain"}}),60000);if(!r.ok)throw new Error("put "+r.status)},
  get:async box=>{const r=await withTimeout(fetch(`${base}/get?box=${box}`,{cache:"no-store"}),20000);if(r.status===200)return await r.text();if(r.status===204)return null;
    const err=new Error("get "+r.status);if(r.status===404)err.gone=true;throw err},
  close:sess=>{if(sess)fetch(`${base}/close`,{method:"POST"}).catch(()=>{})}}}
function bridgeTransport(origin,win){
  let seq=0; const pend=new Map();
  const onMsg=e=>{if(e.origin!==origin||!e.data||e.data.mm!=="bridge"||e.data.op!=="res")return;const p=pend.get(e.data.id);if(p){pend.delete(e.data.id);p(e.data)}};
  addEventListener("message",onMsg);
  const call=(op,box,body)=>new Promise((res,rej)=>{if(win.closed)return rej(new Error("连接小窗口被关掉了"));const id=++seq;pend.set(id,res);
    win.postMessage({mm:"bridge",op,box,body,id},origin);setTimeout(()=>{if(pend.has(id)){pend.delete(id);rej(new Error("timeout"))}},60000)});
  return{put:(box,b)=>call("put",box,b).then(r=>{if(!r.ok)throw new Error(r.err||"put")}),
    get:box=>call("get",box).then(r=>{if(!r.ok){const err=new Error(r.err||"get");if(!r.err)err.gone=true;throw err}return r.body}),
    close:sess=>{try{win.postMessage({mm:"bridge",op:"close",sess:!!sess},origin)}catch{}removeEventListener("message",onMsg)}}
}

  const fin=()=>{try{l.tr&&l.tr.close(l.role==="pc")}catch{}};
  if(sayBye&&l.up){link=l;lkSend({t:"bye"}).catch(()=>{}).finally(()=>{link=null;fin()})} else fin();
  $("#linkbar").classList.remove("open"); document.body.classList.remove("linked");
}

/* 手机这边：扫到电脑的连接码 */
async function linkJoin(code){
  const [, ver, ipsStr, port, token, keyStr]=code.split("|"); const ips=ipsStr.split(",").filter(Boolean);
  if(link) linkEnd(true);
  link={role:"phone",token,key:await crypto.subtle.importKey("raw",unb64url(keyStr),"AES-GCM",false,["encrypt","decrypt"]),in:"phone",out:"pc",wait:new Map(),up:false};
  const fail=msg=>{openModal(`<h3>😢 连不上电脑</h3><p class="d">${msg}</p>
    <p class="d">请检查：<br>· 手机和电脑连的是<b>同一个 Wi-Fi / 路由器</b><br>· 公司网络有时会把手机和电脑隔开（访客 Wi-Fi 一般连不上）<br>· 电脑上「连接手机」的窗口还开着</p>
    <p class="d">连不上也没关系：可以用「扫码同步」单向传，或者「导出同步包」。</p><div class="actions"><button class="btn pri" data-x>知道了</button></div>`);
    $("#mcard").onclick=e=>{if(e.target.closest("[data-x]"))closeModal()};link=null};
  if(IS_APP){ // 安卓 App：直接连
    for(const ip of ips){const base=`http://${ip}:${port}/s/${token}`;
      try{const r=await withTimeout(fetch(base+"/hello",{cache:"no-store"}),3500);if(r.ok){link.tr=httpTransport(base);break}}catch{}}
    if(!link.tr) return fail("试了 "+ips.map(esc).join("、")+"，都没连上。");
    await lkSend({t:"hello",name:devName()}); lkStartPoll(); toast("📶 正在连接…"); return;
  }
  // iPhone / 浏览器：借一个“连接小窗口”转一下（苹果不让网页直接连局域网里的电脑）
  let idx=0;
  const tryIp=()=>{const ip=ips[idx], origin=`http://${ip}:${port}`;
    openModal(`<h3>💻 找到电脑了</h3><p class="d">点下面的按钮，会弹出一个小窗口帮忙连接。<br><b>连上后切回「脑屎」</b>，那个小窗口别关。</p>
      <div class="actions" style="justify-content:center"><button class="btn pri" data-go style="height:46px;padding:0 28px;font-size:15px">📶 连接电脑（${esc(ip)}）</button></div>
      <div class="qrinfo" id="ltxt"></div><div class="actions"><button class="btn" data-x>取消</button></div>`);
    $("#mcard").onclick=e=>{
      if(e.target.closest("[data-x]")){closeModal();link=null;return}
      if(!e.target.closest("[data-go]")) return;
      const win=window.open(`${origin}/s/${token}/bridge`,"mmbridge");
      if(!win){$("#ltxt").textContent="小窗口被拦住了：请允许弹出窗口后再点一次";return}
      $("#ltxt").textContent="正在连接…";
      let ok=false;
      const onReady=async ev=>{if(ev.origin!==origin||!ev.data||ev.data.mm!=="bridge"||ev.data.op!=="ready")return;
        ok=true;removeEventListener("message",onReady);link.tr=bridgeTransport(origin,win);
        try{await lkSend({t:"hello",name:devName()});lkStartPoll();$("#ltxt").textContent="✅ 连上了，等电脑回应…"}catch(err){fail(esc(err.message||err))}};
      addEventListener("message",onReady);
      setTimeout(()=>{if(ok||!link)return;removeEventListener("message",onReady);try{win.close()}catch{}
        if(++idx<ips.length) tryIp(); else fail("试了 "+ips.map(esc).join("、")+"，都没连上。")},9000);
    };
  };
  tryIp();
}

  const x=e.clientX,y=e.clientY,g=gest, far=t=>Math.hypot(x-g.sx,y-g.sy)>t;

function nodeAt(x,y){const el=document.elementFromPoint(x,y);const n=el&&el.closest&&el.closest(".node");return n?n.dataset.id:null}
function endPointer(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(!gest) return;
  if(gest.kind==="pinch"){ if(ptrs.size<2) gest=null; return }
  const g=gest; gest=null; clearTimeout(g.lpT); stage.classList.remove("panning");
  if(e.type==="pointercancel"){gest=g;cancelGesture();gest=null;return}
  if(g.lp){marq.style.display="none";return}
  const x=e.clientX,y=e.clientY;
  switch(g.kind){
    case "frame":
      if(g.moved){const T=now();g.g.posAt=T;g.g.updatedAt=T;g.mem.forEach(m=>m.n.posAt=T);renderFrames();save();return}
      {const t=performance.now(); if(lastTab.id===g.g.id&&t-lastTab.t<350){lastTab.id=null;renameGroup(g.g.id)} else lastTab={id:g.g.id,t}}
      return;
    case "fres": if(g.moved){g.g.posAt=now();g.g.updatedAt=now();updateMembership(alive().map(n=>n.id));renderFrames();updateSelbar();save()} return;
    case "node":
      if(g.moved){const T=now();g.start.forEach((p,k)=>{const n=byId(k);if(n)n.posAt=T});updateMembership([...g.start.keys()]);renderFrames();save();updateSelbar();return}
      if(connectMode){finishConnectMode(g.id);return}
      select(g.id); return;
    case "edge": if(!g.moved) pickEdge(g.id); return;
    case "pan":
      if(g.moved) return;
      if(g.ctx){ if(g.ctx.node) nodeCtx(g.ctx.node,x,y); else if(g.ctx.edge) edgeCtx(g.ctx.edge,x,y); else if(g.ctx.group) groupCtx(g.ctx.group,x,y); else canvasCtx(x,y); return }
      tapEmpty(x,y); return;
    case "marq":
      marq.style.display="none";
      if(!g.moved){ if(!g.add) tapEmpty(x,y); return }
      setSel([...selSet],{noPanel:selSet.size!==1}); return;
    case "knife": knife.innerHTML=""; doKnife(g.pts); return;
    case "connect":{
      tempLine=null; nodeEls.forEach(el=>el.classList.remove("target"));
      const t=nodeAt(x,y);
      if(t&&t!==g.from){ if(!findEdge(g.from,t)){pushUndo();addEdge(g.from,t);renderAll();burst(x,y,byId(g.from).color);toast("已连上 🔗")} else renderEdges() }
      else if(!t){renderEdges();openRadial(x,y,g.from)}
      else renderEdges();
      return}
  }
}
function tapEmpty(x,y){

  if(t-lastTap.t<320&&Math.hypot(x-lastTap.x,y-lastTap.y)<24){lastTap.t=0;openRadial(x,y);return}

function drawKnife(){const p=gest.pts;knife.innerHTML=`<path d="M${p.map(q=>q[0]+","+q[1]).join(" L")}"/>`}
function segX(p1,p2,p3,p4){
  const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x); if(!d) return false;
  const t=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d, u=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
  return t>=0&&t<=1&&u>=0&&u<=1;
}
function doKnife(pts){
  if(pts.length<2){toast("✂️ 按住拖动，划过连线就能剪断");return}
  const W=pts.map(([x,y])=>toWorld(x,y)), hit=[];
  for(const e of S.edges){ if(e.deleted) continue; const a=byId(e.a),b=byId(e.b); if(!a||!b||a.deleted||b.deleted) continue;
    const C=edgePts(a,b); let ok=false;
    for(let i=1;i<W.length&&!ok;i++) for(let j=1;j<C.length&&!ok;j++) if(segX(W[i-1],W[i],C[j-1],C[j])) ok=true;
    if(ok) hit.push(e.id) }
  if(hit.length) cutEdges(hit); else toast("✂️ 没划到线");
}

function strength(p){let s=0;if(!p)return 0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^\w]/.test(p))s++;return s}

function genPass(len=16){
  const cs="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*?-_";
  const r=new Uint32Array(len); crypto.getRandomValues(r); let p=[...r].map(x=>cs[x%cs.length]).join("");

    else{inp.value=final; inp.dispatchEvent(new Event("input",{bubbles:true}));

function burst(x,y,color="#7c6cff"){

/* ================= 登录密码与加密 =================
   数据文件 / 本机存储 / 同步包 / 二维码 全部用 AES-256-GCM 加密。
   钥匙由登录密码经 PBKDF2-SHA256（60 万轮）算出来；密码本身从不保存，只在解锁期间留在内存里。 */
const KDF_ITER=600000, LSLOCK="mymemory.autolock";
let VAULT=null, locked=false, lockSrc=null, lastAct=Date.now(), hiddenAt=0, badTries=0;
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
const isSealed=o=>!!(o&&o.format==="mymemory"&&o.encrypted===true&&o.ct&&o.kdf);
async function sealData(data,v=VAULT){
  let u=new TextEncoder().encode(JSON.stringify(data)), z=0;
  if(window.CompressionStream){u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());z=1}
  const iv=crypto.getRandomValues(new Uint8Array(12)), ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},v.key,u));
  return {format:"mymemory",ver:2,savedAt:new Date().toISOString(),encrypted:true,kdf:{name:"PBKDF2-SHA256",iter:v.iter,salt:v.saltB64},z,iv:b64e(iv),ct:b64e(ct),hint:v.hint||""};
}
async function openSealed(obj,key){
  const pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(obj.iv)},key,b64d(obj.ct)));
  return JSON.parse(obj.z?await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text():new TextDecoder().decode(pt));
}
async function tryPw(obj,pw){
  try{const iter=Math.min(5e6,Math.max(1e5,+obj.kdf.iter||KDF_ITER)), key=await deriveKey(pw,b64d(obj.kdf.salt),iter);
    return {key,iter,data:await openSealed(obj,key)}}catch{return null}
}
const vaultFrom=(obj,r,pw)=>({key:r.key,iter:r.iter,saltB64:obj.kdf.salt,pw,hint:typeof obj.hint==="string"?obj.hint.slice(0,60):""});
/* 打开任何一个包：明文直接读；加密的先用当前登录密码试，不行再问 */
async function readPack(obj,label="这个文件",adopt){
  if(!isSealed(obj)) return unpack(obj);
  if(VAULT){
    if(VAULT.saltB64===obj.kdf.salt){try{return unpack(await openSealed(obj,VAULT.key))}catch{}}
    const r=await tryPw(obj,VAULT.pw); if(r){if(adopt)VAULT=vaultFrom(obj,r,VAULT.pw);return unpack(r.data)}
  }
  for(;;){
    const pw=await askPassword(`🔐 ${label}是用另一个密码加密的`,obj.hint); if(pw===null) throw new Error("cancel");
    const r=await tryPw(obj,pw); if(r){if(adopt)VAULT=vaultFrom(obj,r,pw);return unpack(r.data)} toast("😣 密码不对");
  }
}
async function packOut(data=S){return VAULT?await sealData(data):{format:"mymemory",ver:1,savedAt:new Date().toISOString(),encrypted:false,data}}

const LSEXP="mymemory.lastExport";
let fileHandle=null, fileOK=false, saveT=null, writing=Promise.resolve(), dirty=false;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("mymemory",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=rej})}
async function idbGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch{return null}}
async function idbSet(k,v){try{const d=await idb();d.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch{}}
function save(){if(locked)return;dirty=true;setStatus("saving");clearTimeout(saveT);saveT=setTimeout(flush,450)}
async function flush(){
  clearTimeout(saveT); if(locked) return;
  if(fileHandle&&fileOK){ // 电脑：数据只写进你的数据文件，浏览器里不留副本（拔走 U 盘，公司电脑上就不剩东西）
    try{localStorage.removeItem(LS);localStorage.removeItem(LS+".backup")}catch{}
    writeFile(); return }
  try{localStorage.setItem(LS,JSON.stringify(await packOut()))}catch{toast(MODE==="desktop"?"浏览器缓存满了，请尽快存成数据文件":"本机空间不够了，先导出一份备份！")}
  dirty=false;setStatus()
}
function writeFile(){
  writing=writing.then(async()=>{const out=await packOut();const w=await fileHandle.createWritable();await w.write(JSON.stringify(out));await w.close();dirty=false;setStatus()})
    .catch(err=>{console.warn(err);fileOK=false;setStatus();banner("⚠️ 写不进数据文件（U 盘拔了？换了电脑？）","重新打开",openDataFile)});
}
function setStatus(st){
  const d=$("#sdot"),t=$("#stext"), local=MODE!=="desktop", ok=local||(fileHandle&&fileOK);

}

/* 导出：安卓 App 用系统分享；iPhone 用分享面单（可存到“文件”、发 LocalSend）；电脑直接下载 */
async function shareOrDownload(name){
  const txt=JSON.stringify(await packOut());
  if(IS_APP){
    const P=Capacitor.Plugins;
    const r=await P.Filesystem.writeFile({path:name,data:txt,directory:"CACHE",encoding:"utf8"});
    try{await P.Share.share({title:"脑屎 同步包",files:[r.uri],dialogTitle:"把同步包发到…"})}
    catch(e){if(/cancel/i.test(String(e&&e.message||e)))return false;throw e}
    return true;
  }
  if(MODE==="mobile"&&navigator.canShare){
    const file=new File([txt],name,{type:"application/json"});
    if(navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:"脑屎 同步包"});return true}
      catch(e){if(e.name==="AbortError")return false}
    }
  }
  download(name,txt); return true;
}

/* ================= 同步合并 =================
   每条记录带一个 anc（“出过门的版本”指纹列表）。
   - 对方的版本在我的 anc 里 → 对方是旧的，留我的
   - 我的版本在对方的 anc 里 → 我是旧的，用对方的
   - 都不在 → 两边都改过 → 让用户挑
   这样不管导出、导入的先后顺序怎么乱，都不会拿旧的盖掉新的。 */
function h32(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)}
const hashN=n=>h32(JSON.stringify([n.type,n.title||"",n.icon||null,n.color||"",n.fields||[],n.note||"",!!n.deleted]));
const hashE=e=>h32(JSON.stringify([e.a,e.b,!!e.deleted]));
const addAnc=(n,...hs)=>{const a=(n.anc||[]).filter(x=>!hs.includes(x));n.anc=a.concat(hs.filter(Boolean)).slice(-40)};
const hashG=g=>h32(JSON.stringify([g.title||"",g.color||"",[...(g.members||[])].sort(),!!g.deleted]));
function markSynced(D){D.nodes.forEach(n=>addAnc(n,hashN(n)));(D.groups||[]).forEach(g=>addAnc(g,hashG(g)))}
/* 位置：谁最后挪过就听谁的（posAt 更新的那边） */
function takePos(l,r,keys){if((r.posAt||0)>(l.posAt||0)){keys.forEach(k=>l[k]=r[k]);l.posAt=r.posAt}}
function mergeData(L,R){
  const out=JSON.parse(JSON.stringify(L)), conflicts=[], st={add:0,upd:0};
  out.groups=out.groups||[];
  const lm=new Map(out.nodes.map(n=>[n.id,n]));
  for(const r0 of R.nodes){
    const r=JSON.parse(JSON.stringify(r0)), l=lm.get(r.id);
    if(!l){addAnc(r,hashN(r));out.nodes.push(r);if(!r.deleted)st.add++;continue}
    const hl=hashN(l),hr=hashN(r), la=l.anc||[], ra=r.anc||[];
    if(hl===hr){addAnc(l,...ra,hl);takePos(l,r,["x","y"]);continue}
    if(la.includes(hr)){addAnc(l,...ra,hr,hl);takePos(l,r,["x","y"])}                               // 只有本机改了
    else if(ra.includes(hl)){const keep={x:l.x,y:l.y,posAt:l.posAt||0};Object.assign(l,r);addAnc(l,...la,hl,hr);
      if(keep.posAt>(r.posAt||0))Object.assign(l,keep);st.upd++}                                   // 只有对方改了
    else conflicts.push({l,r,hl,hr});                                                             // 两边都改了
  }
  const em=new Map(out.edges.map(e=>[e.id,e]));
  for(const r of R.edges){
    const l=em.get(r.id); if(!l){out.edges.push({...r});continue}
    if(hashE(l)!==hashE(r)&&(r.updatedAt||0)>(l.updatedAt||0)) Object.assign(l,r);
  }
  const gm=new Map(out.groups.map(g=>[g.id,g]));
  for(const r0 of (R.groups||[])){
    const r=JSON.parse(JSON.stringify(r0)), l=gm.get(r.id);
    if(!l){addAnc(r,hashG(r));out.groups.push(r);continue}
    const hl=hashG(l),hr=hashG(r),la=l.anc||[],ra=r.anc||[];
    if(hl!==hr&&!la.includes(hr)&&(ra.includes(hl)||(r.updatedAt||0)>(l.updatedAt||0))){const keep={x:l.x,y:l.y,w:l.w,h:l.h,posAt:l.posAt||0};Object.assign(l,r);if(keep.posAt>(r.posAt||0))Object.assign(l,keep)}
    else takePos(l,r,["x","y","w","h"]);
    addAnc(l,...la,...ra,hl,hr);
  }
  const ids=new Set(out.logos.map(l=>l.id)); R.logos.forEach(l=>{if(!ids.has(l.id))out.logos.push(l)});
  out.demo=L.demo&&R.demo;
  return {out,conflicts,st};
}
async function importMerge(txt){
  let R; try{R=await readPack(JSON.parse(txt),"这个同步包")}catch(err){if(err.message!=="cancel")toast("这不是「脑屎」的数据文件");return false}
  const {out,conflicts,st}=mergeData(S,R);
  if(conflicts.length){
    const pick=await resolveConflicts(conflicts); if(!pick){toast("已取消合并，什么都没改");return false}
    conflicts.forEach((c,i)=>{
      const p=pick[i], l=out.nodes.find(n=>n.id===c.l.id), la=l.anc||[], ra=c.r.anc||[];
      if(p==="r"||(p==="both"&&l.deleted)){Object.assign(l,JSON.parse(JSON.stringify(c.r)));addAnc(l,...la,c.hl,c.hr)}
      else{
        addAnc(l,...ra,c.hr,c.hl);
        if(p==="both"&&!c.r.deleted){const cp=Object.assign(JSON.parse(JSON.stringify(c.r)),{id:uid(),anc:[],title:(c.r.title||"未命名")+"（另一份）",x:c.r.x+70,y:c.r.y+70,updatedAt:now()});
          out.nodes.push(cp); out.edges.push({id:uid(),a:l.id,b:cp.id,updatedAt:now()})}
      }
    });
  }
  pushUndo(); S=out; nodeEls.forEach(el=>el.remove()); nodeEls.clear(); closePanel(); renderAll(); save(); fitView();
  celebrate(); toast(`🔀 合并完成 · 新增 ${st.add} · 更新 ${st.upd} · 冲突 ${conflicts.length}`,{ms:5000,action:"撤销",fn:undo});
  return true;
}
function sumHTML(n,other){
  if(n.deleted) return `<h4>已删除</h4><span class="df">这一边把它删掉了</span>`;
  const om=new Map((other.fields||[]).map(f=>[f.label,f]));
  const rows=(n.fields||[]).map(f=>{const o=om.get(f.label),d=!o||o.value!==f.value;
    return `<div class="${d?"df":""}">${esc(f.label)}：${f.secret?(f.value?"••••••"+(d?"（不同）":""):"—"):esc(f.value||"—")}</div>`}).join("");
  return `<h4>${n.updatedAt>1?new Date(n.updatedAt).toLocaleString("zh-CN",{hour12:false})+" 改的":"示例数据"}</h4><div class="${n.title!==other.title?"df":""}"><b>${esc(n.title||"未命名")}</b></div>${rows}${n.note?`<div class="${n.note!==other.note?"df":""}">备注：${esc(n.note.slice(0,60))}</div>`:""}`;
}
function resolveConflicts(cs){
  return new Promise(res=>{
    const pick=cs.map(c=>(c.r.updatedAt||0)>(c.l.updatedAt||0)?"r":"l");
    const me=MODE==="desktop"?"💻 本机":"📱 本机";
    openModal(`<h3>⚡ 有 ${cs.length} 条两边都改过</h3><p class="d">其它没冲突的已经自动合好了。下面每条点一下要保留哪边（已默认选了较新的），或者「两个都留」。黄色是不同的地方。</p>
      <div id="cfl">${cs.map((c,i)=>`<div class="cf" data-i="${i}"><div class="ct">${esc(c.l.title||c.r.title||"未命名")}<button class="bothbtn" data-p="both">两个都留</button></div>
        <div class="side" data-p="l"><h4 style="color:var(--text)">${me}</h4>${sumHTML(c.l,c.r)}</div>
        <div class="side" data-p="r"><h4 style="color:var(--text)">📦 导入的</h4>${sumHTML(c.r,c.l)}</div></div>`).join("")}</div>
      <div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn pri" data-x="ok">确定合并</button></div>`,true);
    const paint=()=>document.querySelectorAll(".cf").forEach(el=>{const p=pick[+el.dataset.i];
      el.querySelector('[data-p="l"]').classList.toggle("on",p==="l");el.querySelector('[data-p="r"]').classList.toggle("on",p==="r");el.querySelector(".bothbtn").classList.toggle("on",p==="both")});
    paint();
    modalResolve=res;
    $("#mcard").onclick=e=>{
      const s=e.target.closest("[data-p]"); if(s){pick[+s.closest(".cf").dataset.i]=s.dataset.p;paint();return}
      const x=e.target.closest("[data-x]"); if(!x) return;
      $("#mcard").onclick=null; const r=modalResolve; modalResolve=null; $("#modal").classList.remove("open");
      r(x.dataset.x==="ok"?pick:null);
    };
  });
}

    $("#mcard").onclick=null; $("#modal").classList.remove("open");
    if(w.dataset.w==="blank"){S=blankData();nodeEls.forEach(el=>el.remove());nodeEls.clear();renderAll();fitView(true);toast("✨ 双击空白处，加第一个吧")}
    else banner(MODE==="desktop"?"👋 随便玩。准备好了就「数据 → 清空示例」，再「新建数据文件」存到 U 盘":"👋 随便玩。准备好了点右上角「数据 → 清空示例数据」");
    flush(); celebrate(); setTimeout(hideBannerIfInfo,9000);
  };
}

/* ================= 启动 ================= */
async function boot(){
  let raw=null; try{raw=localStorage.getItem(LS)}catch{}
  const h=FS?await idbGet("handle"):null;
  if(localStorage.getItem(LSTIP)) $("#tips").remove(); else $("#tipsX").onclick=()=>{localStorage.setItem(LSTIP,1);$("#tips").remove()};
  S={nodes:[],edges:[],logos:[],groups:[],demo:false}; renderAll(); setStatus();
  if(h){   // 电脑：数据在 U 盘的数据文件里
    let p="prompt"; try{p=await h.queryPermission({mode:"readwrite"})}catch{}
    if(p==="granted"){try{await afterFileRead(h,await (await h.getFile()).text());return}catch{showLock("missing",{h,name:h.name});return}}
    showLock("file",{h,name:h.name}); return;
  }
  let obj=null; try{obj=raw?JSON.parse(raw):null}catch{}
  if(obj&&isSealed(obj)){lockSrc={kind:"ls"};showLock("unlock",{src:lockSrc,hint:obj.hint});return}
  if(obj){try{S=unpack(obj)}catch{S=demoData()} renderAll(); restoreCam(); showLock("setup",{}); return}   // 旧版明文：先设密码
  S=demoData(); renderAll(); fitView(true); lockSrc={kind:"ls"}; showLock("setup",{first:true});        // 第一次用
}
function hideBannerIfInfo(){if(!$("#banner").querySelector("button"))hideBanner()}
window.addEventListener("beforeunload",()=>{if(dirty)flush()});
window.addEventListener("pagehide",()=>{if(dirty)flush()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&dirty)flush()});
window.addEventListener("resize",()=>applyCam());

/* iPhone / 安卓浏览器：装到主屏幕 + 离线缓存（电脑上双击打开时不需要） */
if(/^https?:$/.test(location.protocol)&&!IS_APP){
  const l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

if(MODE==="desktop"){srvPing();setInterval(srvPing,20000)}   // 告诉同步站“软件还开着”
boot();

/* 缩放按钮 */
document.body.insertAdjacentHTML("beforeend",`<div id="zoom" class="glass"><button class="tb" id="zo">${svg("minus")}</button><span id="zl" title="点我 100%">100%</span><button class="tb" id="zi">${svg("plus")}</button></div>`);
$("#zo").onclick=()=>{const c=viewCenter();zoomAt(c.x,c.y,1/1.25)};
$("#zi").onclick=()=>{const c=viewCenter();zoomAt(c.x,c.y,1.25)};
$("#zl").onclick=()=>{const c=viewCenter(),w=toWorld(c.x,c.y);animateCam(c.x-w.x,c.y-w.y,1,400)};
applyCam();
</script>
